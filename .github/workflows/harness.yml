name: Browser harness

# The unit suite cannot see a modal that traps focus or a phone layout that overflows. This runs the real Chrome
# sweep against a throwaway demo server. It is deliberately not a merge gate: a browser job is slower and noisier
# than the unit suite, so it runs nightly and on demand.
#
# Three scripts stay local-only:
# - `live.mjs` needs a driven Chrome that actually paints frames. The runner's headless Chromium produced none
#   (the `Non-black frames` check failed), which is an environment limit, not an app regression.
# - `wheel.mjs` opens the same live pane and waits for its stage; with no frames it times out.
# - `recovery.mjs` restarts the server through the blueprint helper on the machine that owns the app.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: browser-harness
  cancel-in-progress: false

jobs:
  harness:
    name: ${{ matrix.group }} (${{ matrix.scripts }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Order inside each shard preserves seed state: sweep is read-only, channels adds #taxes,
          # approvals decides pending cards while the background task badge is still 1; polish runs
          # on a clean seed before dialogs cancels the running task.
          - group: core
            scripts: sweep channels approvals
          - group: security-a11y
            scripts: pairing a11y
          - group: ui-dialogs
            scripts: polish dialogs
    env:
      APP_URL: http://127.0.0.1:7466/
      BP_OUT: ${{ github.workspace }}/blueprint-out
      CHROME_PATH: /usr/bin/google-chrome
      DUET_CHROME_BIN: /usr/bin/google-chrome
      DUET_CHROME_PORT: '9334'
      DUET_CHROME_PROFILE: ${{ github.workspace }}/blueprint-out/chrome-profile
      DUET_HERMES_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Start the demo app and the live-pane fixture
        run: |
          bun scripts/demo.ts --reset > /tmp/demo.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:7466/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:7466/api/health
          python3 -m http.server 7499 -d tools/blueprint/fixture > /tmp/fixture.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:7499/tap.html >/dev/null && break
            sleep 1
          done

      - name: Run the browser sweep
        run: |
          failed=""
          for s in ${{ matrix.scripts }}; do
            echo "=== $s ==="
            if ! node "tools/blueprint/$s.mjs"; then
              failed="$failed $s"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed scripts:$failed" >&2
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blueprint-evidence-${{ matrix.group }}
          path: blueprint-out
          retention-days: 14
