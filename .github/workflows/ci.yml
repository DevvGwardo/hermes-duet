name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      # Same dependency tree every run: the lockfile is committed.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build web app
        run: bun run build

      # Advisory only: a new advisory never blocks the merge, but it is reported.
      - name: Dependency audit (advisory)
        run: bun audit --production --audit-level=moderate || true

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The image is the documented Linux path; a broken Dockerfile must not first be discovered by a user.
      - name: Build image
        run: docker build -t hermes-duet:ci .
