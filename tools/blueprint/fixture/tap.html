<!doctype html>
<html lang="utf-8">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blueprint tap fixture</title>
<style>
  html,body{margin:0;height:100%}
  #tap{position:fixed;inset:0;border:0;width:100%;height:100%;font:700 72px system-ui,sans-serif;background:#ffbf00;color:#111;cursor:pointer}
</style>
</head>
<body>
<button id="tap">TAP ME</button>
<script>
  const b = document.getElementById('tap');
  b.addEventListener('click', () => {
    b.textContent = 'TAPPED';
    b.style.background = '#8fe39a';
    document.title = 'TAPPED';
  });
</script>
</body>
</html>
